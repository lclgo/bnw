server {
    listen PORT;
    server_name IPADDR;

    # Enable HTTP Basic Authentication for the entire site
    auth_basic "Wiki Access - Please enter your credentials";
    auth_basic_user_file /etc/nginx/http.d/.htpasswd;

    # Proxy all requests to the wiki server running on port 30030
    location / {
        proxy_pass http://127.0.0.1:30030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 50M;
    }

    # Deny access to hidden files at root level only (not in subdirectories like node_modules/.vite)
    location ~ ^/\.[^/]+$ {
        deny all;
    }
    
    # Also deny common sensitive files
    location ~ /\.(git|env|htpasswd|htaccess)$ {
        deny all;
    }

    # Error pages
    error_page 401 /401.html;
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
